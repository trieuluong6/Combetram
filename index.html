<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Order Cơm & Hải Sản</title>

<!-- Lật giấy mở màn: Ẩn toàn bộ phần tử trước khi JS tính toán thứ tự lật sóng -->
<script>
  document.documentElement.classList.add('paper-flip-pending');
  // Failsafe: Đảm bảo giao diện luôn hiện ra sau tối đa 3s kể cả khi mạng chậm
  setTimeout(function() {
    document.documentElement.classList.remove('paper-flip-pending');
  }, 3000);
</script>
<style>
  html.paper-flip-pending #weather-hub,
  html.paper-flip-pending #crowd-status,
  html.paper-flip-pending .header-title,
  html.paper-flip-pending .bw-badge,
  html.paper-flip-pending #btc-ticker,
  html.paper-flip-pending #btn-theme-toggle,
  html.paper-flip-pending .table-btn,
  html.paper-flip-pending #hint,
  html.paper-flip-pending .cat-btn,
  html.paper-flip-pending .menu-item,
  html.paper-flip-pending .bill-box,
  html.paper-flip-pending #pay-btn {
    visibility: hidden !important;
  }
</style>

<!-- Tải song song CSS & JS modules ngay từ đầu để triệt tiêu độ trễ mạng nối đuôi -->
<link rel="stylesheet" href="style.css?v=2026.11.19-v1">
<link rel="modulepreload" href="app.js?v=2026.11.19-v1">
<link rel="modulepreload" href="menu.js?v=2026.11.19-v1">
</head>
<body>

<div class="header-bar">
  <div class="header-left-group">
    <div id="weather-hub" class="weather-hub" title="Thời tiết & Không khí Đà Nẵng">
      <div class="wx-main">
        <span id="wx-icon" class="wx-icon">🌤️</span>
        <span id="wx-temp" class="wx-temp">--°C</span>
        <span id="wx-desc" class="wx-desc">Đà Nẵng</span>
      </div>
      <div class="wx-sub">
        <span class="wx-chip" title="Độ ẩm không khí">💧 <b id="wx-hum">--%</b></span>
        <span class="wx-chip" title="Khả năng mưa giờ tới">☔ <b id="wx-rain">--%</b></span>
        <span class="wx-chip" title="Chỉ số chất lượng không khí US AQI">🍃 AQI <b id="wx-aqi" class="wx-aqi-pill">--</b></span>
      </div>
    </div>

    <div id="crowd-status" class="crowd-badge crowd-empty" title="Tự động ước tính theo số lượng món ăn chính đang phục vụ">
      🍃 Quán đang trống (0 khách)
    </div>
  </div>

  <div class="header-title">
    <h2><span class="title-icon">🍽️</span> <span class="title-text">QUÁN CƠM & HẢI SẢN</span></h2>
  </div>

  <div class="header-actions">
    <div class="bw-badge" title="Dữ liệu tải xuống từ Firebase">
      <span class="bw-down">⬇ <b id="bw-down">0 B</b></span>
    </div>

    <div id="btc-ticker" class="btc-ticker" title="Giá Bitcoin (BTC/USDT) thời gian thực từ Binance">
      <div class="btc-left">
        <span class="btc-symbol">₿ BTC</span>
        <span id="btc-price" class="btc-price">$--</span>
        <span id="btc-change" class="btc-change">--%</span>
      </div>
      <canvas id="btc-spark" class="btc-spark" width="72" height="22"></canvas>
    </div>

    <button id="btn-theme-toggle" class="theme-toggle-btn" title="Chuyển đổi giao diện Sáng / Tối" aria-label="Chuyển đổi giao diện">🌙</button>
  </div>
</div>

<!-- Chọn bàn -->
<div id="tables"></div>

<div id="hint">
  <div class="hint-icon">👆</div>
  <p>Vui lòng chọn bàn ở phía trên để bắt đầu gọi món</p>
</div>

<!-- Khu vực gọi món & hóa đơn -->
<div id="main-area" style="display:none;">
  <div class="workspace-grid">
    <!-- Cột trái: Danh mục + Thực đơn -->
    <div class="menu-panel">
      <div id="categories"></div>
      <div id="menu"></div>
    </div>

    <!-- Cột phải: Hóa đơn + Chọn ngôn ngữ + Thanh toán -->
    <div class="bill-panel">
      <!-- Khe máy in hóa đơn -->
      <div id="printer-slot" class="printer-slot" aria-hidden="true"></div>
      <div id="bill-shell" class="bill-flip-shell">
        <div id="bill" class="bill-box"></div>
      </div>

      <div class="lang-section">
        <p class="lang-label">🌐 Ngôn ngữ hiển thị hóa đơn:</p>
        <div id="lang-grid" class="lang-grid">
          <button data-lang="vi" class="lang-btn active-lang">🇻🇳</button>
          <button data-lang="en" class="lang-btn">🇺🇸</button>
          <button data-lang="fr" class="lang-btn">🇫🇷</button>
          <button data-lang="kr" class="lang-btn">🇰🇷</button>
          <button data-lang="jp" class="lang-btn">🇯🇵</button>
          <button data-lang="th" class="lang-btn">🇹🇭</button>
          <button data-lang="it" class="lang-btn">🇮🇹</button>
          <button data-lang="pt" class="lang-btn">🇵🇹</button>
          <button data-lang="es" class="lang-btn">🇪🇸</button>
          <button data-lang="cn" class="lang-btn">🇨🇳</button>
          <button data-lang="de" class="lang-btn">🇩🇪</button>
          <button data-lang="ru" class="lang-btn">🇷🇺</button>
          <button data-lang="be" class="lang-btn">🇧🇪</button>
          <button data-lang="hu" class="lang-btn">🇭🇺</button>
          <button data-lang="at" class="lang-btn">🇦🇹</button>
          <button data-lang="tw" class="lang-btn">🇹🇼</button>
          <button data-lang="sg" class="lang-btn">🇸🇬</button>
          <button data-lang="id" class="lang-btn">🇮🇩</button>
          <button data-lang="my" class="lang-btn">🇲🇾</button>
          <button data-lang="in" class="lang-btn">🇮🇳</button>
          <button data-lang="fi" class="lang-btn">🇫🇮</button>
          <button data-lang="nl" class="lang-btn">🇳🇱</button>
          <button data-lang="se" class="lang-btn">🇸🇪</button>
          <button data-lang="ch" class="lang-btn">🇨🇭</button>
        </div>
      </div>

      <button id="pay-btn" disabled>THANH TOÁN</button>
    </div>
  </div>
</div>

<!-- Thông báo nhỏ (Toast) -->
<div id="toast" class="toast"></div>

<!-- Modal Thanh toán VietQR -->
<div id="modal">
  <div id="modal-box">
    <h3 id="modal-title">Thanh toán</h3>
    <p class="modal-subtitle">Quét mã VietQR để chuyển khoản nhanh</p>
    <div id="modal-total" class="modal-total">0đ</div>
    <div class="qr-wrapper">
      <img id="qr-img" src="" alt="Mã VietQR thanh toán">
    </div>
    <p class="modal-note">Nội dung chuyển khoản & số tiền đã được điền tự động</p>
    <div class="modal-actions">
      <button id="confirm-pay">✅ XÁC NHẬN ĐÃ THU TIỀN</button>
      <button id="cancel-pay">Hủy</button>
    </div>
  </div>
</div>

<!-- Đổi tham số phiên bản đồng bộ với các thẻ link ở phần head khi cập nhật thực đơn -->
<script type="module" src="app.js?v=2026.11.19-v1"></script>
</body>
</html>
