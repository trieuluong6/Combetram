name: Deploy Cơm Bé Trâm to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp build version (UTC timestamp)
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          ver = datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')
          print(f'Stamping build version: {ver}')

          for filename in ('index.html', 'app.js'):
              p = Path(filename)
              if p.exists():
                  content = p.read_text(encoding='utf-8')
                  updated = content.replace('__BUILD_VER__', ver)
                  p.write_text(updated, encoding='utf-8')

          Path('.nojekyll').touch()
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
